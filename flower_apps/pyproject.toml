[project]
name = "noesis-agents"
version = "0.2.0"
description = "Flower SuperGrid AgentApp for Noesis camera, critic, and director model jobs"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = ["flwr>=1.39.0,<1.40.0", "httpx>=0.27,<1", "openai>=2.16,<3"]

[tool.flwr.app]
publisher = "thesid42"
flwr-version-target = "1.39.0"
fab-format-version = 1
display-name = "Noesis"

[tool.flwr.app.components]
agentapp = "noesis_agents.agent_app:app"

[tool.flwr.app.config]
"agent.input" = "Noesis SuperGrid coordinator prompt: JSON with mode=coordinator, duration_s (maximum 240), and optional trusted node_ids. SuperNode roles are supplied through trusted node configuration."
