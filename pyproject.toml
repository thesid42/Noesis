[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noesis"
version = "0.1.0"
description = "Autonomous multi-camera directing with Flower agents and OBS"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "soundfile>=0.13,<1",
  "simpleobsws>=1.4,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
flower = ["flwr==1.39.0", "openai>=2.16,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.hatch.build.targets.wheel]
packages = ["noesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".runtime/pytest-cache"

