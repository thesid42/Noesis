<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('noesis-theme')||'day'}catch(e){}</script>
    <title>Noesis · Program</title>
    <link rel="stylesheet" href="/static/styles.css?v=program-ui-20260929">
    <link rel="stylesheet" href="/static/program.css?v=program-ui-20260929">
    <script src="/static/program.js?v=program-ui-20260929" defer></script>
  </head>
  <body class="program-page">
    <main class="program-output" id="program-output" aria-label="Noesis program output">
      <img class="program-feed is-visible" id="program-feed" src="/api/program.jpg" alt="Selected program camera" decoding="async">
      <div class="output-empty" id="output-empty"><span>▧</span><strong>Program is standing by</strong><small>Start a session in the Noesis control room.</small></div>
      <div class="output-shade" aria-hidden="true"></div>
      <div class="output-topline">
        <span class="output-live" id="output-live"><i></i><span>STANDBY</span></span>
        <span class="output-identity"><i aria-hidden="true"><b></b><b></b><b></b></i><span class="output-label" id="output-label">LOCAL PROGRAM SIGNAL</span></span>
        <span class="output-clock" id="output-clock">00:00</span>
      </div>
      <div class="program-lowerthird" id="program-lowerthird">
        <span class="output-kicker" id="output-kicker">NOESIS</span>
        <strong id="output-camera">Awaiting program source</strong>
        <span id="output-reason">The controller’s selected camera will appear here.</span>
      </div>
      <div class="output-footline"><span id="input-label">INPUT NOT REPORTED</span><span id="scene-label"></span><span class="output-mark"><i></i> NOESIS</span></div>
      <div class="output-progress" aria-hidden="true"><i id="output-progress"></i></div>
      <button class="program-audio" id="program-audio-button" type="button" hidden aria-pressed="false"><span aria-hidden="true">♫</span><span id="audio-label">Enable program audio</span></button>
      <span class="program-error" id="program-error" role="status" aria-live="polite"></span>
      <audio id="program-audio" preload="none"></audio>
    </main>
  </body>
</html>
